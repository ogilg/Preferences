conditions:
- name: differential
  cache_injection: differential
  probe: ridge_L12
  layers:
  - 12
  multipliers:
  - -0.50
  - -0.30
  - 0.0
  - 0.30
  - 0.50
  spans:
    first: 1
    second: -1
